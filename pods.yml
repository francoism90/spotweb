version: 1
name: spotweb
label: Spotweb
description: Decentralized Usenet community based on the Spotnet protocol
author: francoism90
icon: i-lucide-newspaper
category: Media
website: https://github.com/spotweb/spotweb
repository: https://github.com/francoism90/spotweb
notes: >-
    Sign in as admin with password admin, change it, and enter your Usenet
    server under Settings. Until then, the hourly retrieve job fails.

sources:
    production:
        path: containers/systemd/spotweb
        description: The published image

secrets:
    spotweb-db-password:
        description: Password of the Spotweb database
        generate: true

after_install:
    database:
        label: Create the database
        container: spotweb
        user: spotweb
        command: php /app/bin/upgrade-db.php

after_update:
    upgrade:
        label: Upgrade the database
        container: spotweb
        user: spotweb
        command: php /app/bin/upgrade-db.php

routes:
    app:
        upstream: systemd-spotweb:8000
        description: The web interface

ondemand:
    port: 8000
    app_port: 8000
    idle_timeout: 10min

timers:
    retrieve:
        description: Fetches new spots from the Usenet server
        container: spotweb-retrieve
        on_calendar: hourly
        # Catch up on a missed run after the host was off.
        persistent: true
        randomized_delay_sec: 5min
