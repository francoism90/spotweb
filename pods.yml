version: 1
name: spotweb
label: Spotweb
description: Decentralized Usenet community based on the Spotnet protocol
author: francoism90
icon: i-lucide-newspaper
category: Media
website: https://github.com/spotweb/spotweb
repository: https://github.com/francoism90/spotweb
notes: >-
    Run the installer at /install.php once the units are up. Until then, the
    hourly retrieve job fails.

sources:
    production:
        path: containers/systemd/spotweb
        description: The published image

routes:
    app:
        upstream: systemd-spotweb:8000
        description: The web interface

ondemand:
    port: 8000
    app_port: 8000
    idle_timeout: 10min

timers:
    retrieve:
        description: Fetches new spots from the Usenet server
        container: spotweb-retrieve
        on_calendar: hourly
        # Catch up on a missed run after the host was off.
        persistent: true
        randomized_delay_sec: 5min
